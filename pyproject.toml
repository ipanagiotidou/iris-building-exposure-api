[project]
name = "iris-building-exposure-api"
version = "0.1.0"
description = ""
authors = [
    {name = "ipanagiotidou",email = "ioannapanag@yahoo.com"}
]

[tool.poetry]
packages = [{ include = "app" }]

readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn[standard] (>=0.44.0,<0.45.0)",
    "pydantic (>=2.13.1,<3.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "rasterio (==1.4.4)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "geoalchemy2 (>=0.19.0,<0.20.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "psycopg (>=3.3.3,<4.0.0)",
    "osmnx (>=2.1.0,<3.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mapclassify (>=2.10.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.10"
black = "^26.3.1"
mypy = "^1.20.1"
pytest = "^9.0.3"
ipykernel = "^7.2.0"

